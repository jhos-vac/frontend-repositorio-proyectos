name: CI/CD frontend

# Gitflow: feature/* -> develop -> main. Solo main despliega en el servidor.
on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Compilar
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000
      - name: Lint
        run: npm run lint
        continue-on-error: true

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, semillero]
    steps:
      - uses: actions/checkout@v4
      - name: Copiar codigo y reconstruir
        run: |
          set -e
          APP="$HOME/apps/semillero"
          rsync -a --delete --exclude='.git' --exclude='node_modules' --exclude='dist' ./ "$APP/frontend-repositorio-proyectos/"
          cd "$APP"
          flock /tmp/semillero-deploy.lock docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build frontend
          docker image prune -f
      - name: Verificar que responde
        run: |
          cd "$HOME/apps/semillero"
          PORT=$(grep '^FRONTEND_PORT=' .env.prod | cut -d= -f2)
          for i in $(seq 1 20); do
            if curl -s -o /dev/null --max-time 5 "http://localhost:$PORT/"; then echo "Frontend responde"; exit 0; fi
            sleep 3
          done
          docker logs --tail 40 semillero_frontend
          exit 1
